<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F6E64">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Монетки">
<title>Монетки</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#ECEFF2; --line:#E1E5E9; --fg:#12161C; --muted:#5B6470;
  --accent:#0F6E64; --accent-ink:#FFFFFF; --accent-soft:#DCEFEB;
  --in:#6D52E8; --in-ink:#4B33C2; --acc:#EE8A3C; --acc-ink:#A04C0B; --acc-band:#FBFAF6; --exp:#13977F; --exp-ink:#0B6B59;
  --bar-in:#2E6FB0; --bar-exp:#E8833A; --good:#0F6E64; --bad:#B23A0A; --warn:#B4530A;
  --l-obl:#2E5FA8; --l-base:#0F6E64; --l-irr:#B4530A; --l-hob:#7A3FB8;
  --display:"Unbounded","Golos Text",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1316; --surface:#181D21; --sunk:#222930; --line:#2C343B; --fg:#E9EDF0; --muted:#9AA5AE;
  --accent:#3FB8A8; --accent-ink:#06201C; --accent-soft:#173632;
  --in:#7D66F0; --in-ink:#B3A6FF; --acc:#E88A40; --acc-ink:#F5B47E; --acc-band:#1C1F1E; --exp:#19A58B; --exp-ink:#6FD6C0;
  --bar-in:#6FA4E0; --bar-exp:#F0A060; --good:#4CC2A8; --bad:#F08A6A; --warn:#F0A060;
  --l-obl:#7FA8E8; --l-base:#3FB8A8; --l-irr:#F0A060; --l-hob:#BE92F0;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.35;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* header */
.hdr{background:var(--surface);padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 8px rgba(0,0,0,.08);position:relative;z-index:2}
.hdr-row{display:flex;align-items:stretch}
.totals{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;padding:10px 4px 8px 12px}
.totals span{display:block;font-size:12px;color:var(--muted)}
.totals b{display:block;font-size:16px;font-weight:600;margin-top:2px;white-space:nowrap}
.chev{width:52px;border:0;background:transparent;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.chev svg{transition:transform .2s}
.month{display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px 8px;font-size:13px;color:var(--muted)}
.month button{border:0;background:transparent;width:36px;height:30px;border-radius:8px;color:var(--muted)}
.month b{color:var(--fg);font-weight:600;min-width:120px;text-align:center}
/* coins */
.band{padding:12px 6px 10px;border-bottom:1px solid var(--line)}
.band.in{background:var(--surface)} .band.acc{background:var(--acc-band)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px}
/* доходы и счета — одна строка с прокруткой вбок; пятая монета выглядывает, подсказывая, что дальше есть ещё */
.hscroll{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 2px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .coin{flex:0 0 23.5%;scroll-snap-align:start;touch-action:pan-x}
.hscroll.few .coin{flex-basis:25%}
.coin{display:flex;flex-direction:column;align-items:center;gap:5px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border:0;background:transparent;padding:0}
.coin .nm{font-size:12px;color:var(--muted);max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coin .c{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .12s}
.coin .s{font-size:13px;font-weight:600}
.coin.in .c{background:var(--in)} .coin.in .s{color:var(--in-ink)}
.coin.acc .c{background:var(--acc)} .coin.acc .s{color:var(--acc-ink)}
.coin.exp .c{background:var(--exp)} .coin.exp .s{color:var(--exp-ink)}
.coin.src .c{box-shadow:0 0 0 4px rgba(127,127,127,.25)}
.coin.hot .c{transform:scale(1.12);box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--fg)}
.coin.add .c{border:2px dashed var(--line);background:transparent}
.hint{text-align:center;font-size:12px;color:var(--muted);padding:16px 16px 20px}
.ghost{position:fixed;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.3);pointer-events:none;z-index:50}
/* nav */
nav{flex:none;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));position:relative;z-index:3}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-height:50px;padding:4px}
nav button[aria-current="page"]{color:var(--accent);font-weight:600}
/* pages */
.page{padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.page h1{margin:0;font-size:22px}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:15px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.sub{font-size:12px;color:var(--muted)}
.big{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.3px}
.btn{border:0;border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600;background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:20px 8px}
.day{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:4px 2px 0}
.op{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:0;border-radius:12px;width:100%;text-align:left}
.dot{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.op .grow{flex:1;min-width:0}
.op .t{font-size:14px;font-weight:500}
.op .a{font-weight:600;white-space:nowrap}
.track{height:8px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;border-bottom:1px solid var(--line)}
.bars button{flex:1;min-width:0;height:100%;border:0;padding:0;background:transparent;border-radius:6px 6px 0 0;display:flex;align-items:flex-end;justify-content:center;gap:1px}
.bars button[aria-pressed="true"]{background:var(--sunk)}
.bars i{width:45%;border-radius:3px 3px 0 0;display:block}
.blabels{display:flex;gap:4px}.blabels span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;min-height:42px;color:var(--fg);font-size:15px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,16,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);overflow-y:auto;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pair{flex:1;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;min-width:0;flex-wrap:wrap}
.pair span{color:#fff;border-radius:10px;padding:6px 10px}
.x{width:44px;height:44px;border:0;border-radius:12px;background:var(--sunk);flex:none;display:flex;align-items:center;justify-content:center}
.amount{font-family:var(--display);font-size:34px;font-weight:600;text-align:center;padding:2px 0}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys button{height:50px;border:0;border-radius:14px;background:var(--sunk);font-size:20px;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center}
details.card{gap:0}
details.card summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:28px}
details.card summary::-webkit-details-marker{display:none}
details.card summary .grow{flex:1}
details.card .arr{color:var(--muted);transition:transform .2s;flex:none}
details.card[open]>summary .arr,details.arch[open]>summary .arr{transform:rotate(180deg)}
details.arch>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 2px;color:var(--muted);font-size:14px}
details.arch>summary::-webkit-details-marker{display:none}
details.arch>summary .arr{transition:transform .2s;flex:none}
details.arch .archbody{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.secbody{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.pay{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.pay:first-of-type{border-top:0}
.pday{text-align:center;background:var(--sunk);border-radius:10px;padding:8px 0;font-size:17px;font-weight:700}
.pinfo{border:0;background:transparent;text-align:left;padding:4px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.pinfo b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pright .btn.small{min-height:34px;padding:4px 12px}
.notice{background:var(--accent-soft);border-radius:14px;padding:14px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.mv{width:34px;height:34px;border-radius:10px;border:0;background:var(--sunk);color:inherit;display:grid;place-items:center;cursor:pointer}.mv:disabled{opacity:.3;cursor:default}

/* подпись itivan: V всегда розовая; на светлом — чёрная окантовка V */
.sig .vo{stroke:#0E0F12}
@media (prefers-color-scheme:dark){.sig .vo{stroke:none}}

/* заставка при запуске: логотип + блик, меньше секунды; нажатия проходят насквозь */
#splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:var(--bg);color:var(--fg);pointer-events:none;animation:spl-out .28s ease-in .78s forwards}
#splash .spl-in{position:relative;padding:10px 14px;animation:spl-pop .3s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes spl-pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
#splash .shine{position:absolute;left:14px;top:10px;opacity:.9;-webkit-mask-image:linear-gradient(105deg,transparent 42%,#000 50%,transparent 58%);mask-image:linear-gradient(105deg,transparent 42%,#000 50%,transparent 58%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;animation:spl-shine .55s ease-in-out .2s forwards}
#splash .shine :is(polyline,line):not([style*="--bg"]):not(.vo){stroke:#fff!important}#splash .shine path{fill:#fff}#splash .shine .vo{display:none}
@keyframes spl-shine{to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes spl-out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash,#splash .spl-in,#splash .shine{animation-duration:.01s;animation-delay:0s}#splash{animation-delay:.3s}}
</style>
</head>

<div id="app">
  <section class="screen" id="s-coins">
    <div class="hdr">
      <div class="hdr-row">
        <div class="totals num">
          <div><span>Доходы</span><b id="t-inc">0 ₽</b></div>
          <div><span>Расходы</span><b id="t-exp">0 ₽</b></div>
          <div><span>В планах</span><b id="t-plan">0 ₽</b></div>
        </div>
        <button class="chev" id="toggle-in" aria-label="Показать доходы"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </div>
    <div class="scroll" id="coins-scroll">

<script>
'use strict';
/* ---------- данные ---------- */
const KEY='monetki.v1';
const ICONS={
  job:'M3 8h18v11H3zM9 8V5h6v3M3 13h18', trend:'M3 20h18M6 16l4-5 4 3 5-7M15 7h4v4', tag:'M3 12V4h8l10 10-8 8zM7.5 8h.01',
  star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z', wallet:'M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-3v3M16 14h2',
  card:'M3 6h18v12H3zM3 10h18M7 15h4', bank:'M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18', cart:'M3 5h2l2 10h10l2-7H7.5M9 20h.01M17 20h.01',
  cup:'M5 8h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5zM17 10h2a2 2 0 0 1 0 4h-2M9 3v2M13 3v2', home:'M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5',
  bag:'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2', car:'M4 16h16M6 16l1.5-5h9L18 16M5 16v3M19 16v3M8 13.5h.01M16 13.5h.01',
  person:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0', heart:'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',
  scale:'M12 4v16M7 20h10M4 8h16M6 8l-3 6a3 3 0 0 0 6 0zM18 8l-3 6a3 3 0 0 0 6 0z', plus:'M12 5v14M5 12h14',
  baby:'M12 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM7 21v-5a5 5 0 0 1 10 0v5M9 13l-3 3M15 13l3 3', med:'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z', receipt:'M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6'
};
const CK_ICON={BarChart:'trend',Hobbies:'star',ShoppingBag:'bag',Card:'card',Car:'car',Bank:'bank',Cash:'wallet',Flower:'heart',Book:'star',Property:'home',Eating:'cup',House:'home',Groceries:'cart',Woman:'person',Debt:'scale'};
const LAYERS={obl:{n:'Обязательное',c:'--l-obl'},base:{n:'Быт',c:'--l-base'},irr:{n:'Нерегулярное',c:'--l-irr'},hob:{n:'Хобби',c:'--l-hob'}};
const DEFAULT_LAYER={'Жена':'obl','Продукты':'base','Перекус':'base','Семья':'base','На себя':'base','Авто':'irr','Покупки':'irr','Убытки':'irr'};
const EXP_ORDER=['Продукты','Перекус','Семья','Покупки','Авто','Жена','На себя','Убытки'];
// Базовая структура для «С нуля»: категории с подкатегориями (подкатегории — готовые метки)
const BASE={
  in:[['Зарплата','job'],['Подработка','trend'],['Прочее','star']],
  acc:[['Кошелёк','wallet'],['Карта','card'],['Вклад','bank',{reval:true,revalDays:30}]],
  exp:[['Магазин','cart','base',['Продукты','Алкоголь']],
       ['Перекус','cup','base',['Кофе','Столовая','Кафе']],
       ['Дом','home','obl',['Коммуналка','Связь','Интернет','Кредит','Ремонт'],{'ремонт':'irr'}],
       ['Семья','heart','obl',['Общее','Жена'],{'жена':'irr'}],
       ['Авто','car','irr',['Бензин','Ремонт','Мойка','Штрафы'],{'бензин':'base'}],
       ['На себя','person','hob',['Одежда','Стрижка','Здоровье','Подписки','Хобби','Развлечения'],{'одежда':'base','стрижка':'base','здоровье':'obl','подписки':'obl'}],
       ['Прочее','scale','irr',['Неучтёнка','Потери']]]
};
const IN_ORDER=['ЗП','Активы','Авито','Прочее'];
const ACC_ORDER=['Кошелек','Карта','ЦифБрок','Вклад ₽'];
const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MON_S=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

let S=load();
function blank(){return {v:1,items:[],ops:[],regular:[],seq:1}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return s}catch(e){}return null}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Не удалось сохранить: память браузера переполнена');return false}}
function uid(p){return p+(S.seq++).toString(36)}
const byId=id=>S.items.find(x=>x.id===id);
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const rub=n=>fmt(n)+' ₽';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ym(d){return d.slice(0,7)}
function addMonth(m,k){let [y,mo]=m.split('-').map(Number);mo+=k;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+'-'+String(mo).padStart(2,'0')}
function svg(path,size,stroke){return '<svg width="'+(size||26)+'" height="'+(size||26)+'" viewBox="0 0 24 24" fill="none" stroke="'+(stroke||'#fff')+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+path+'"/></svg>'}

/* ---------- расчёты ---------- */
// Расход по категории = пришло в неё − вернулось из неё. Доход = ушло из источника. Баланс = старт + пришло − ушло.
function flows(month){
  const r={};
  for(const o of S.ops){
    if(month&&ym(o.d)!==month)continue;
    (r[o.to]=r[o.to]||{i:0,o:0}).i+=o.sum;(r[o.from]=r[o.from]||{i:0,o:0}).o+=o.sum;
  }
  return r;
}
function itemValue(it,mf,all){
  if(it.g==='acc'){const f=all[it.id]||{i:0,o:0};return (it.start||0)+f.i-f.o}
  const f=mf[it.id]||{i:0,o:0};
  return it.g==='in'?f.o-f.i:f.i-f.o;
}
function monthSpend(month,maxDay){
  let s=0;const exp=new Set(S.items.filter(x=>x.g==='exp').map(x=>x.id));
  for(const o of S.ops){if(ym(o.d)!==month)continue;if(maxDay&&+o.d.slice(8)>maxDay)continue;if(exp.has(o.to))s+=o.sum;if(exp.has(o.from))s-=o.sum}
  return s;
}
function monthIncome(month){let s=0;const inc=new Set(S.items.filter(x=>x.g==='in').map(x=>x.id));for(const o of S.ops){if(ym(o.d)!==month)continue;if(inc.has(o.from))s+=o.sum;if(inc.has(o.to))s-=o.sum}return s}
function regDone(r,month){return S.ops.some(o=>o.reg===r.id&&ym(o.d)===month)}
function regActive(r,month){return !r.until||month<=r.until}

/* ---------- состояние UI ---------- */
let tab='coins', month=ym(today()), showIn=false, statMonth=ym(today());

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  ['coins','hist','plan','stats','more'].forEach(t=>$('s-'+t).hidden=t!==tab);
  if(tab==='coins')renderCoins();
  if(tab==='hist')renderHist();
  if(tab==='plan')renderPlan();
  if(tab==='stats')renderStats();
  if(tab==='more')renderMore();
}
function monthLabel(m){const [y,mo]=m.split('-');return MON[+mo-1][0].toUpperCase()+MON[+mo-1].slice(1)+' '+y}

function renderCoins(){
  const first=!S;$('first-run').hidden=!first;$('bands').hidden=first;
  if(first){['g-in','g-acc','g-exp'].forEach(id=>$(id).innerHTML='');return}
  const cm=ym(today()),mf=flows(cm),all=flows(null);  // главный экран всегда показывает текущий месяц
  const vis=g=>S.items.filter(x=>x.g===g&&!x.hidden);
  const coin=it=>'<button class="coin '+it.g+'" data-id="'+it.id+'"><span class="nm">'+esc(it.name)+'</span><span class="c">'+svg(ICONS[it.icon]||ICONS.star)+'</span><span class="s num">'+rub(itemValue(it,mf,all))+'</span></button>';
  // в конце каждого ряда — монета «+», чтобы добавить доход, счёт или категорию прямо отсюда
  const add=(g,l)=>'<button class="coin add" data-add="'+g+'" aria-label="Добавить '+l+'"><span class="nm">Добавить</span><span class="c">'+svg(ICONS.plus,22,'var(--muted)')+'</span><span class="s">&nbsp;</span></button>';
  $('g-in').innerHTML=vis('in').map(coin).join('')+add('in','доход');$('g-in').classList.toggle('few',vis('in').length<4);
  $('g-acc').innerHTML=vis('acc').map(coin).join('')+add('acc','счёт');$('g-acc').classList.toggle('few',vis('acc').length<4);
  $('g-exp').innerHTML=vis('exp').map(coin).join('')+add('exp','категорию');
  $('band-in').hidden=!showIn;
  $('toggle-in').querySelector('svg').style.transform=showIn?'rotate(180deg)':'none';
  $('toggle-in').setAttribute('aria-label',showIn?'Скрыть доходы':'Показать доходы');
  $('t-inc').textContent=rub(monthIncome(cm));
  $('t-exp').textContent=rub(monthSpend(cm));
  $('t-plan').textContent=rub(S.regular.filter(r=>regActive(r,cm)&&!regDone(r,cm)).reduce((s,r)=>s+r.sum,0));
  const due=revalDue();
  $('reval-banner').hidden=!due.length;
  $('reval-banner').innerHTML=due.map(r=>'<div class="notice" style="flex-direction:row;align-items:center;padding:10px 12px;margin-bottom:6px"><span class="grow" style="flex:1;font-size:14px">Пора переоценить <b>'+esc(r.it.name)+'</b><br><span class="sub">'+(r.days==null?'ещё не переоценивал':'последний раз '+r.days+' дн. назад')+'</span></span><button class="btn small primary" data-reval="'+r.it.id+'">Переоценить</button></div>').join('');
  $('reval-banner').querySelectorAll('[data-reval]').forEach(b=>b.onclick=()=>openReval(b.dataset.reval));
}

/* ---------- переоценка ---------- */
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function lastReval(id){for(let i=S.ops.length-1;i>=0;i--){const o=S.ops[i];if(o.reval&&(o.to===id||o.from===id))return o.d}return null}
function revalDue(){
  if(!S)return [];const t=today();
  return S.items.filter(x=>x.g==='acc'&&!x.hidden&&x.reval).map(it=>{const l=lastReval(it.id);return {it,days:l?daysBetween(l,t):null}}).filter(r=>r.days==null||r.days>=(r.it.revalDays||30));
}
function gainItem(){let it=S.items.find(x=>x.g==='in'&&x.name==='Активы');if(!it){it={id:uid('i'),g:'in',name:'Переоценка',icon:'trend',hidden:true};S.items.push(it)}return it}
// Сверка остатка для обычных счетов (кошелёк, карта): разница уходит в выбранную категорию/доход или просто правит остаток
function openCheck(id){
  const it=byId(id),cur=itemValue(it,{},flows(null));let v='',target=null;
  const draw=()=>{
    const nv=v===''?null:+v,diff=nv==null?0:Math.round(nv-cur);
    const opts=diff<0?S.items.filter(x=>x.g==='exp'&&!x.hidden):diff>0?S.items.filter(x=>x.g==='in'&&!x.hidden):[];
    if(target&&target!=='skip'&&!opts.some(o=>o.id===target))target=null;
    $('panel').innerHTML='<div class="row"><b class="grow">Сверить остаток: '+esc(it.name)+'</b><button class="x" id="c-close" aria-label="Закрыть">✕</button></div>'+
     '<div class="sub">В приложении: <b class="num">'+rub(cur)+'</b>. Сколько на самом деле?</div>'+
     '<div class="amount num">'+(v===''?'—':Number(v).toLocaleString('ru-RU')+' ₽')+'</div>'+
     (nv==null||diff===0?'<div class="sub" style="text-align:center">'+(nv==null?'&nbsp;':'совпадает')+'</div>':
      '<div class="sub num" style="text-align:center;font-size:14px;color:'+(diff>0?'var(--good)':'var(--bad)')+'">'+(diff>0?'больше на '+rub(diff)+' — откуда?':'меньше на '+rub(-diff)+' — на что ушло?')+'</div>'+
      '<div class="chips">'+opts.map(o=>'<button class="chip" data-t="'+o.id+'" aria-pressed="'+(target===o.id)+'">'+esc(o.name)+'</button>').join('')+
      '<button class="chip" data-t="skip" aria-pressed="'+(target==='skip')+'">Не учитывать</button></div>'+
      (target==='skip'?'<div class="sub">Остаток поправится, в доходы и расходы разница не попадёт.</div>':''))+
     '<div class="keys">'+['1','2','3','4','5','6','7','8','9','00','0','⌫'].map(k=>'<button data-k="'+k+'">'+k+'</button>').join('')+'</div>'+
     '<button class="btn primary" id="c-save"'+(nv==null||(diff!==0&&!target)?' disabled':'')+'>Сохранить</button>';
    $('c-close').onclick=closeSheet;
    $('panel').querySelectorAll('[data-k]').forEach(k=>k.onclick=()=>{const x=k.dataset.k;v=x==='⌫'?v.slice(0,-1):(v+x).replace(/^0+(?=\d)/,'').slice(0,10);draw()});
    $('panel').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{target=b.dataset.t;draw()});
    $('c-save').onclick=()=>{
      if(diff!==0){
        if(target==='skip')it.start=(it.start||0)+diff;
        else S.ops.push(diff<0?{id:uid('o'),d:today(),from:it.id,to:target,sum:-diff,tag:'сверка'}:{id:uid('o'),d:today(),from:target,to:it.id,sum:diff,tag:'сверка'});
        S.ops.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
      }
      persist();closeSheet();toast(it.name+': '+rub(nv));render()};
  };
  draw();$('sheet').hidden=false;
}
function openReval(id){
  const it=byId(id),cur=itemValue(it,{},flows(null));let v='';
  const draw=()=>{const nv=v===''?null:+v,diff=nv==null?0:nv-cur;
    $('panel').innerHTML='<div class="row"><b class="grow">Переоценка: '+esc(it.name)+'</b><button class="x" id="v-close" aria-label="Закрыть">✕</button></div>'+
     '<div class="sub">Сейчас в приложении: <b class="num">'+rub(cur)+'</b>. Введи, сколько на счёте по данным брокера или банка.</div>'+
     '<div class="amount num">'+(v===''?'—':Number(v).toLocaleString('ru-RU')+' ₽')+'</div>'+
     '<div class="sub num" style="text-align:center;font-size:14px;color:'+(diff>0?'var(--good)':diff<0?'var(--bad)':'var(--muted)')+'">'+(nv==null?'&nbsp;':diff===0?'без изменений':(diff>0?'рост +'+rub(diff)+' → доход «Активы»':'просадка −'+rub(-diff)+' → «Убытки»'))+'</div>'+
     '<div class="keys">'+['1','2','3','4','5','6','7','8','9','00','0','⌫'].map(k=>'<button data-k="'+k+'">'+k+'</button>').join('')+'</div>'+
     '<button class="btn primary" id="v-save"'+(nv==null?' disabled':'')+'>Сохранить</button>';
    $('v-close').onclick=closeSheet;
    $('panel').querySelectorAll('[data-k]').forEach(k=>k.onclick=()=>{const x=k.dataset.k;v=x==='⌫'?v.slice(0,-1):(v+x).replace(/^0+(?=\d)/,'').slice(0,10);draw()});
    $('v-save').onclick=()=>{const g=gainItem(),d=Math.round(nv-cur);
      // рост — доход «Активы», просадка — расход «Убытки» (как велось в CoinKeeper); нулевая — отметка, что проверено
      const loss=S.items.find(x=>x.g==='exp'&&x.name==='Убытки')||g;
      S.ops.push(d>=0?{id:uid('o'),d:today(),from:g.id,to:it.id,sum:d,reval:true,tag:'переоценка'}:{id:uid('o'),d:today(),from:it.id,to:loss.id,sum:-d,reval:true,tag:'просадка'});
      S.ops.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);persist();closeSheet();toast(it.name+': '+rub(nv));render()};
  };
  draw();$('sheet').hidden=false;
}

/* ---------- перетаскивание ---------- */
let drag=null;
function canMove(a,b){if(!a||!b||a.id===b.id)return false;return (a.g==='in'&&b.g==='acc')||(a.g==='acc'&&b.g==='acc')||(a.g==='acc'&&b.g==='exp')}
const colorVar={in:'var(--in)',acc:'var(--acc)',exp:'var(--exp)'};
$('coins-scroll').addEventListener('pointerdown',e=>{
  const el=e.target.closest('.coin');if(!el)return;
  if(el.dataset.add)return;  // «+» открывается по клику, чтобы свайп ряда его не срабатывал
  drag={id:el.dataset.id,x:e.clientX,y:e.clientY,moved:false,el,ghost:null,hot:null};
  el.setPointerCapture&&el.setPointerCapture(e.pointerId);
});
$('coins-scroll').addEventListener('click',e=>{const a=e.target.closest('.coin[data-add]');if(a)openItemEdit(null,a.dataset.add)});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8){
    drag.moved=true;drag.el.classList.add('src');
    const g=document.createElement('div');g.className='ghost';g.style.background=colorVar[byId(drag.id).g];document.body.appendChild(g);drag.ghost=g;
  }
  if(!drag.moved)return;
  e.preventDefault();
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest('.coin[data-id]');
  const ok=c&&canMove(byId(drag.id),byId(c.dataset.id))?c:null;
  if(drag.hot&&drag.hot!==ok)drag.hot.classList.remove('hot');
  if(ok)ok.classList.add('hot');drag.hot=ok;
},{passive:false});
function endDrag(e,cancel){

/* ---------- аналитика ---------- */
// открытые блоки аналитики: по умолчанию «Месяц» и «Категории»
const statOpen=new Set((()=>{try{const v=JSON.parse(localStorage.getItem('monetki.statOpen'));if(Array.isArray(v))return v}catch(e){}return ['month','cats']})());
const STAT_KEYS=['money','month','year','cats','types'];
// порядок блоков аналитики — тоже на этом устройстве; новые блоки добавляются в конец
const statOrder=(()=>{let v=[];try{v=JSON.parse(localStorage.getItem('monetki.statOrder'))||[]}catch(e){}v=v.filter(k=>STAT_KEYS.includes(k));return v.concat(STAT_KEYS.filter(k=>!v.includes(k)))})();
const statPos=k=>statOrder.indexOf(k);let statEdit=false;
function renderStats(){
  let h='<h1 style="display:flex;align-items:center;gap:8px"><span style="flex:1">Аналитика</span>'+(S&&S.ops.length?'<button id="s-order" class="btn small" style="font-size:14px" aria-pressed="'+statEdit+'">'+(statEdit?'Готово':'Порядок')+'</button>':'')+'</h1>';const B={};
  if(!S||!S.ops.length){$('stats').innerHTML=h+'<div class="empty">Появится, когда будут операции.</div>';return}
  const cur=ym(today()),m=statMonth,isCur=m===cur,day=isCur?+today().slice(8):31;
  // деньги сейчас — всегда на сегодня
  const all=flows(null),accs=S.items.filter(x=>x.g==='acc'&&!x.hidden).map(it=>({it,v:itemValue(it,{},all)}));
  const live=accs.filter(a=>!a.it.reval).reduce((s,a)=>s+a.v,0),sav=accs.filter(a=>a.it.reval).reduce((s,a)=>s+a.v,0);

  // в свёрнутом виде видно главное: заголовок, короткая «зацепка» и ключевая цифра
  const sec=(key,title,meta,body,tease)=>'<details class="card" data-asec="'+key+'"'+(statOpen.has(key)?' open':'')+'><summary><span class="grow" style="min-width:0"><h2>'+title+'</h2>'+(tease?'<span class="sub" style="display:block;margin-top:2px">'+tease+'</span>':'')+'</span>'+(statEdit?'<span style="display:flex;gap:6px">'+[[-1,'M6 15l6-6 6 6','Выше'],[1,'M6 9l6 6 6-6','Ниже']].map(([d,p,l])=>'<button class="mv" data-mv="'+key+'" data-d="'+d+'" aria-label="'+l+'"'+(statPos(key)+d<0||statPos(key)+d>=statOrder.length?' disabled':'')+'><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg></button>').join('')+'</span>':'<b class="num" style="white-space:nowrap">'+meta+'</b><svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>')+'</summary><div class="secbody">'+body+'</div></details>';
  B.money=sec('money','Деньги сейчас',rub(live+sav),
     '<div class="two"><div><div class="sub">Живые</div><b class="num">'+rub(live)+'</b></div><div><div class="sub">Накопления</div><b class="num">'+rub(sav)+'</b></div></div>'+
     accs.map(a=>'<div class="row" style="font-size:14px"><span class="grow sub" style="font-size:14px">'+esc(a.it.name)+'</span><span class="num">'+rub(a.v)+'</span></div>').join(''),
     'живые '+rub(live)+' · накопления '+rub(sav));
  // выбор месяца
  const prev=[1,2,3,4,5,6].map(k=>addMonth(m,-k)).filter(x=>S.ops.some(o=>ym(o.d)===x));
  const now=monthSpend(m),usual=prev.length?prev.reduce((s,x)=>s+monthSpend(x,day),0)/prev.length:0,inc=monthIncome(m);
  B.month=sec('month',monthLabel(m),'−'+rub(now),
     '<div class="sub">'+(isCur?'1–'+day+' число':'весь месяц')+'</div><div class="two"><div><div class="sub">Потрачено</div><div class="big num">'+rub(now)+'</div></div><div><div class="sub">'+(isCur?'Обычно к '+day+'-му':'Обычно за месяц')+'</div><div class="big num" style="color:var(--muted)">'+rub(usual)+'</div></div></div>'+
     '<div class="track"><i style="width:'+Math.min(100,usual?now/usual*100:0)+'%;background:'+(now>usual?'var(--bad)':'var(--accent)')+'"></i></div>'+
     '<div class="row" style="font-size:14px"><span class="grow sub" style="font-size:14px">Доходы</span><b class="num" style="color:var(--good)">+'+fmt(inc)+'</b></div>'+
     '<div class="row" style="font-size:14px"><span class="grow sub" style="font-size:14px">Итог месяца</span><b class="num" style="color:'+(inc-now>=0?'var(--good)':'var(--bad)')+'">'+(inc-now>=0?'+':'−')+rub(Math.abs(inc-now))+'</b></div>'+
     '<div class="sub">Сравнение со средним за '+prev.length+' предыдущих мес.'+(isCur?' к этому же числу':'')+'</div>',
     usual?(now<=usual?'на '+Math.round((1-now/usual)*100)+'% меньше обычного':'на '+Math.round((now/usual-1)*100)+'% больше обычного')+' · итог '+(inc-now>=0?'+':'−')+fmt(Math.abs(inc-now)):'');
  // 12 месяцев
  const ms=[];for(let k=11;k>=0;k--)ms.push(addMonth(cur,-k));
  const data=ms.map(x=>({m:x,i:monthIncome(x),e:monthSpend(x)}));
  const max=Math.max(1,...data.map(x=>Math.max(x.i,x.e)));
  const statSel=Math.max(0,ms.indexOf(m)),s=data[statSel],net=s.i-s.e;
  const y12=data.reduce((a,x)=>a+x.i-x.e,0);
  B.year=sec('year','Год',(y12>=0?'+':'−')+rub(Math.abs(y12)),
     '<div class="row"><span class="grow"></span><span class="sub"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--bar-in)"></i> доход &nbsp;<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--bar-exp)"></i> расход</span></div>'+
     '<div class="row num" style="background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:13px"><b class="grow">'+monthLabel(s.m)+'</b><span>+'+fmt(s.i)+' · −'+fmt(s.e)+' · <b style="color:'+(net>=0?'var(--good)':'var(--bad)')+'">'+(net>=0?'+':'−')+fmt(Math.abs(net))+'</b></span></div>'+
     '<div class="bars">'+data.map((x,i)=>'<button data-bar="'+i+'" aria-pressed="'+(i===statSel)+'" aria-label="'+monthLabel(x.m)+'"><i style="height:'+Math.max(2,x.i/max*136)+'px;background:var(--bar-in)"></i><i style="height:'+Math.max(2,x.e/max*136)+'px;background:var(--bar-exp)"></i></button>').join('')+'</div>'+
     '<div class="blabels">'+data.map(x=>'<span>'+MON_S[+x.m.slice(5)-1]+'</span>').join('')+'</div>',
     (()=>{const w=data.slice(0,-1).reduce((a,x)=>x.e>a.e?x:a,{e:0,m:cur});const minus=data.filter(x=>x.i<x.e).length;return 'в минусе '+minus+' мес. из 12 · самый дорогой — '+MON[+w.m.slice(5)-1]})());
  // категории и слои
  const cats=S.items.filter(x=>x.g==='exp');const full=prev;
  const rows=cats.map(c=>{const nowv=catSpend(c.id,m),avg=full.length?full.reduce((s,x)=>s+catSpend(c.id,x),0)/full.length:0;return {c,nowv,avg}}).filter(r=>r.nowv||r.avg).sort((a,b)=>b.avg-a.avg);

  const lay={},expById={};for(const c of cats)expById[c.id]=c;const fs=new Set(full);

// Метки внутри категории: регистр не важен («Алкоголь» = «алкоголь»). Показываем те, что дают ≥15% категории, не больше трёх.
function tagRows(catId,m,prev,catAvg){
  const sum={},disp={};
  const add=(o,k,v)=>{const t=o.tag.trim().toLowerCase();disp[t]=disp[t]||o.tag.trim();sum[t]=sum[t]||{now:0,prev:0};sum[t][k]+=v};
  const ps=new Set(prev);
  for(const o of S.ops){if(o.to!==catId||!o.tag||o.reval)continue;const mm=ym(o.d);if(mm===m)add(o,'now',o.sum);else if(ps.has(mm))add(o,'prev',o.sum)}
  return Object.keys(sum).map(t=>({key:t,name:/^[а-яё]/.test(disp[t])?disp[t][0].toUpperCase()+disp[t].slice(1):disp[t],nowv:sum[t].now,avg:prev.length?sum[t].prev/prev.length:0}))
    .filter(t=>catAvg&&t.avg>=catAvg*0.15).sort((a,b)=>b.avg-a.avg).slice(0,3);
}

let D={cat:null,tag:'',span:12,sel:null};
function catByMonth(catId,tag){
  const r={};
  for(const o of S.ops){if(o.reval&&tag)continue;const hitTag=!tag||(o.tag&&o.tag.trim().toLowerCase()===tag);if(!hitTag)continue;
    const mm=ym(o.d);if(o.to===catId)r[mm]=(r[mm]||0)+o.sum;else if(o.from===catId)r[mm]=(r[mm]||0)-o.sum}
  return r;
}

/* ---------- разбор истории: категории, счета, метки ---------- */
// Объединение категорий и счетов, перенос, переименование и слияние меток по всей истории.
// Перед каждым действием — снимок базы, последнее действие можно отменить.
let sortUndo=null;
const tkey=t=>(t||'').trim().toLowerCase();
const mdate=d=>d.slice(5,7)+'.'+d.slice(0,4);
function itemOps(it){return S.ops.filter(o=>o.to===it.id||o.from===it.id)}
function tagStats(it){
  const m={};
  for(const o of S.ops){if(o.to!==it.id&&o.from!==it.id)continue;const k=tkey(o.tag);
    const r=m[k]=m[k]||{k,name:k?o.tag.trim():'',n:0,s:0};r.n++;r.s+=o.sum}
  for(const sb of it.subs||[]){const r=m[tkey(sb)];if(r)r.name=sb}
  return Object.values(m).sort((a,b)=>(a.k?1:0)-(b.k?1:0)||b.s-a.s);
}
function mergeItems(src,dst,keep){
  for(const o of S.ops){
    if(o.to!==src.id&&o.from!==src.id)continue;
    if(keep&&src.g!=='acc'&&!tkey(o.tag))o.tag=src.name;
    if(o.to===src.id)o.to=dst.id;if(o.from===src.id)o.from=dst.id;
  }
  S.ops=S.ops.filter(o=>o.from!==o.to);   // перевод между двумя слитыми счетами теряет смысл
  if(src.g==='acc')dst.start=(dst.start||0)+(src.start||0);
  if(src.g==='exp'){
    const subs=[...(dst.subs||[])],add=n=>{if(n&&!subs.some(x=>tkey(x)===tkey(n)))subs.push(n)};
    (src.subs||[]).forEach(add);if(keep)add(src.name);dst.subs=subs;
    dst.subLayer=Object.assign({},src.subLayer||{},dst.subLayer||{});
    if(keep&&(src.layer||'base')!==(dst.layer||'base')&&!dst.subLayer[tkey(src.name)])dst.subLayer[tkey(src.name)]=src.layer||'base';
  }
  for(const r of S.regular){if(r.from===src.id)r.from=dst.id;if(r.to===src.id)r.to=dst.id}
  S.items=S.items.filter(x=>x.id!==src.id);
}
function openSort(g){
  g=g||'exp';let cur=null,openTag=null,armed=null;
  const snap=()=>{sortUndo=JSON.stringify(S)};
  const done=msg=>{persist();armed=null;toast(msg);draw();render()};
  const draw=()=>{
    let h='<div class="row">'+(cur?'<button class="btn small" id="z-back">‹ Назад</button><span class="grow"></span>':'<b class="grow">Разбор истории</b>')+

    if(!cur){
      h+='<div class="sub">Объединяй категории и счета, переноси и сливай метки. Меняется вся история; последнее действие можно отменить.</div>';
      h+='<div class="chips">'+[['exp','Расходы'],['in','Доходы'],['acc','Счета']].map(([k,l])=>'<button class="chip" data-zg="'+k+'" aria-pressed="'+(g===k)+'">'+l+'</button>').join('')+'</div>';
      const all=flows(null);

        return {it,n,s:g==='acc'?itemValue(it,{},all):s,tags:g==='acc'?0:tagStats(it).filter(t=>t.k).length}})
        .sort((a,b)=>(a.it.hidden?1:0)-(b.it.hidden?1:0)||b.s-a.s);
      h+=list.map(r=>'<button class="op" style="background:var(--sunk)" data-zi="'+r.it.id+'"><span class="grow" style="min-width:0"><span style="display:block">'+esc(r.it.name)+(r.it.hidden?' <span class="sub">· архив</span>':'')+'</span><span class="sub">'+fmt(r.n)+' оп.'+(r.tags?' · меток: '+r.tags:'')+'</span></span><b class="num">'+rub(r.s)+'</b></button>').join('')||'<div class="sub">Пусто.</div>';
    }else{
      const it=byId(cur),os=itemOps(it),others=S.items.filter(x=>x.g===it.g&&x.id!==it.id);
      const ds=os.map(o=>o.d).sort();
      h+='<h2 style="margin:0">'+esc(it.name)+(it.hidden?' <span class="sub">· архив</span>':'')+'</h2><div class="sub">'+fmt(os.length)+' оп.'+(ds.length?' · '+mdate(ds[0])+' — '+mdate(ds[ds.length-1]):'')+'</div>';
      h+='<button class="btn small" id="z-edit">Название, иконка, подкатегории…</button>';
      if(others.length)h+='<div class="card" style="background:var(--sunk);padding:12px;gap:8px"><b>Объединить</b><label class="field">Перенести все операции в<select id="z-into"><option value="">— выбери —</option>'+others.map(x=>'<option value="'+x.id+'">'+esc(x.name)+(x.hidden?' (архив)':'')+'</option>').join('')+'</select></label>'+
        (it.g!=='acc'?'<label class="row" style="font-size:14px;gap:8px;align-items:flex-start"><input type="checkbox" id="z-keep" checked style="margin-top:3px"><span>Операции без метки получат метку «'+esc(it.name)+'»'+(it.g==='exp'?', она станет подкатегорией':'')+'</span></label>':'<div class="sub">Остатки счетов сложатся, переводы между ними исчезнут.</div>')+
        '<button class="btn" id="z-merge">Объединить</button></div>';
      if(!os.length)h+='<button class="btn" id="z-del">Удалить пустую</button>';
      if(it.g!=='acc'){
        const ts=tagStats(it);
        h+='<b style="margin-top:4px">Метки</b><div class="sub">Нажми на метку: переименуй (назовёшь как другую — сольются), перенеси в другую категорию или убери.</div>';
        h+='<datalist id="z-dl">'+[...new Set([...(it.subs||[]),...ts.filter(t=>t.k).map(t=>t.name)])].map(t=>'<option value="'+esc(t)+'">').join('')+'</datalist>';
        h+=ts.map(t=>{const isSub=t.k&&(it.subs||[]).some(sb=>tkey(sb)===t.k);
          const row='<button class="op" style="background:var(--sunk)" data-zt="'+esc(t.k)+'" aria-expanded="'+(openTag===t.k)+'"><span class="grow" style="min-width:0">'+(t.k?esc(t.name):'<span class="sub">без метки</span>')+(isSub?' <span class="sub">· подкатегория</span>':'')+'</span><span class="sub num">'+fmt(t.n)+' оп. · </span><b class="num">'+rub(t.s)+'</b></button>';
          if(openTag!==t.k)return row;
          return row+'<div class="card" style="background:var(--sunk);padding:12px;gap:8px;margin-top:-4px">'+
            '<label class="field">'+(t.k?'Название метки':'Поставить метку')+'<input id="z-tn" list="z-dl" value="'+esc(t.name)+'" placeholder="'+(t.k?'пусто — убрать метку':'например, Бензин')+'"></label>'+
            '<label class="field">Категория<select id="z-tc">'+[it,...others].map(x=>'<option value="'+x.id+'"'+(x.id===it.id?' selected':'')+'>'+esc(x.name)+(x.hidden?' (архив)':'')+'</option>').join('')+'</select></label>'+
            (it.g==='exp'?'<label class="row" style="font-size:14px;gap:8px"><input type="checkbox" id="z-ts" checked> сделать подкатегорией</label>':'')+
            '<button class="btn primary" id="z-tapply">Применить к '+fmt(t.n)+' оп.</button></div>'}).join('');
      }
    }
    $('panel').innerHTML=h;$('sheet').hidden=false;
    $('z-close').onclick=closeSheet;
    if($('z-back'))$('z-back').onclick=()=>{cur=null;openTag=null;armed=null;draw()};
    if($('z-undo'))$('z-undo').onclick=()=>{S=JSON.parse(sortUndo);sortUndo=null;persist();if(cur&&!byId(cur))cur=null;openTag=null;toast('Отменено');draw();render()};
    $('panel').querySelectorAll('[data-zg]').forEach(b=>b.onclick=()=>{g=b.dataset.zg;draw()});
    $('panel').querySelectorAll('[data-zi]').forEach(b=>b.onclick=()=>{cur=b.dataset.zi;openTag=null;armed=null;draw();$('panel').scrollTop=0});
    if(!cur)return;
    const it=byId(cur);
    $('z-edit').onclick=()=>openItemEdit(cur);
    $('panel').querySelectorAll('[data-zt]').forEach(b=>b.onclick=()=>{openTag=openTag===b.dataset.zt?null:b.dataset.zt;draw();const f=$('z-tn');if(f)f.scrollIntoView({block:'nearest'})});
    if($('z-merge'))$('z-merge').onclick=e=>{const to=$('z-into').value;if(!to){toast('Выбери, куда перенести');return}
      if(armed!=='merge'){armed='merge';e.target.textContent='Точно объединить? Нажми ещё раз';return}
      const dst=byId(to);snap();mergeItems(it,dst,$('z-keep')?$('z-keep').checked:false);cur=dst.id;openTag=null;done('Объединено с «'+dst.name+'»')};
    if($('z-into'))$('z-into').onchange=()=>{armed=null;$('z-merge').textContent='Объединить'};
    if($('z-del'))$('z-del').onclick=e=>{if(armed!=='del'){armed='del';e.target.textContent='Точно удалить?';return}
      snap();S.items=S.items.filter(x=>x.id!==it.id);S.regular=S.regular.filter(r=>r.from!==it.id&&r.to!==it.id);cur=null;done('Удалено')};
    if($('z-tapply'))$('z-tapply').onclick=()=>{
      const k=openTag,nn=$('z-tn').value.trim(),dst=byId($('z-tc').value),mk=!!($('z-ts')&&$('z-ts').checked);
      if(tkey(nn)===k&&dst.id===it.id&&(!mk||!nn||(it.subs||[]).some(x=>tkey(x)===k))&&nn===((tagStats(it).find(t=>t.k===k)||{}).name)){toast('Ничего не изменилось');return}
      snap();let n=0;
      for(const o of S.ops){if((o.to!==it.id&&o.from!==it.id)||tkey(o.tag)!==k)continue;
        if(nn)o.tag=nn;else delete o.tag;
        if(dst.id!==it.id){if(o.to===it.id)o.to=dst.id;if(o.from===it.id)o.from=dst.id}
        n++}
      // старая подкатегория, которой больше нет в операциях, переименовывается или убирается
      if(k&&(it.subs||[]).some(x=>tkey(x)===k)&&!S.ops.some(o=>(o.to===it.id||o.from===it.id)&&tkey(o.tag)===k)){
        const lay=(it.subLayer||{})[k];it.subs=it.subs.filter(x=>tkey(x)!==k);if(it.subLayer)delete it.subLayer[k];

      if(mk&&nn&&dst.g==='exp'){dst.subs=dst.subs||[];if(!dst.subs.some(x=>tkey(x)===tkey(nn)))dst.subs.push(nn)}
      openTag=null;done('Изменено операций: '+fmt(n))};
  };
  draw();

/* ---------- свой CSV: выгрузка и загрузка ---------- */
// Формат для Excel: разделитель «;», UTF-8 с BOM. Строки «Остаток» — начальные остатки счетов.
function download(text,name,type){
  const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
const csvCell=v=>{v=String(v==null?'':v);return /[;",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function exportCsv(){
  const L=['Дата;Тип;Откуда;Куда;Сумма;Метка;Комментарий'];
  for(const it of S.items)if(it.g==='acc')L.push(['','Остаток','',it.name,it.start||0,'',''].map(csvCell).join(';'));
  for(const o of S.ops){const a=byId(o.from)||{},b=byId(o.to)||{};
    const t=a.g==='in'?'Доход':a.g==='acc'&&b.g==='acc'?'Перевод':a.g==='acc'&&b.g==='exp'?'Расход':a.g==='exp'?'Возврат':'';if(!t)continue;
    L.push([o.d.slice(8)+'.'+o.d.slice(5,7)+'.'+o.d.slice(0,4),t,a.name,b.name,o.sum,o.tag||'',o.note||''].map(csvCell).join(';'))}
  download('﻿'+L.join('\r\n'),'monetki-'+today()+'.csv','text/csv;charset=utf-8');
}
function readText(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1251').decode(buf)}}
function importOwn(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0],sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
  const rows=parseCSV(text,sep),h=(rows[0]||[]).map(tkey),ix=n=>h.indexOf(n);
  const c={d:ix('дата'),t:ix('тип'),f:ix('откуда'),to:ix('куда'),s:ix('сумма'),tag:ix('метка'),n:ix('комментарий')};
  if(c.t<0||c.f<0||c.to<0||c.s<0||c.d<0)return null;
  const old=S||blank(),N=blank();N.seq=Math.max(old.seq||1,1);
  const by={in:{},acc:{},exp:{}},used=new Set();
  const get=(g,name)=>{const k=tkey(name);if(by[g][k])return by[g][k];
    const o=old.items.find(x=>x.g===g&&tkey(x.name)===k);   // знакомое название — сохраняем настройки
    const it=o?Object.assign({},o,{name:name.trim()}):{id:'i'+(N.seq++).toString(36),g,name:name.trim(),icon:({in:'job',acc:'wallet',exp:'star'})[g]};
    if(g==='acc'&&!o)it.start=0;if(g==='exp'&&!it.layer)it.layer='base';
    by[g][k]=it;return it};
  const num=v=>{v=String(v||'').replace(/[\s ₽]/g,'').replace(',','.');return v===''?NaN:Math.round(+v)};
  const pdate=v=>{v=String(v||'').trim();let m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
    if(m)return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:null};
  const oldKey={};for(const o of old.ops)oldKey[o.d+'|'+o.from+'|'+o.to+'|'+o.sum]=o;
  let bad=0;
  for(const r of rows.slice(1)){if(!r.some(x=>(x||'').trim()))continue;
    const t=tkey(r[c.t]),f=(r[c.f]||'').trim(),to=(r[c.to]||'').trim(),s=num(r[c.s]);
    if(t==='остаток'){if(to&&!isNaN(s)){const a=get('acc',to);a.start=s;used.add(a)}continue}
    const d=pdate(r[c.d]);if(!d||!s||isNaN(s)||!f||!to){bad++;continue}
    let a,b;
    if(t==='доход'){a=get('in',f);b=get('acc',to)}
    else if(t==='расход'){a=get('acc',f);b=get('exp',to)}
    else if(t==='перевод'){a=get('acc',f);b=get('acc',to)}
    else if(t==='возврат'){a=get('exp',f);b=get('acc',to)}
    else{bad++;continue}
    if(s<0)[a,b]=[b,a];
    used.add(a);used.add(b);
    const op={id:'o'+(N.seq++).toString(36),d,from:a.id,to:b.id,sum:Math.abs(s)};
    const tag=c.tag>=0?(r[c.tag]||'').trim():'';if(tag)op.tag=tag;
    const note=c.n>=0?(r[c.n]||'').trim():'';if(note)op.note=note;
    const was=oldKey[d+'|'+a.id+'|'+b.id+'|'+op.sum];if(was){if(was.reg)op.reg=was.reg;if(was.reval)op.reval=true}
    N.ops.push(op);
  }
  if(!N.ops.length)throw new Error('В файле не нашлось операций');
  // порядок монет — как был; видимые, но пока пустые монеты остаются
  for(const it of old.items)if(!it.hidden&&!used.has(by[it.g][tkey(it.name)])){const x=get(it.g,it.name);used.add(x)}
  const pos=id=>{const i=old.items.findIndex(x=>x.id===id);return i<0?1e9:i};
  N.items=[...used].sort((x,y)=>pos(x.id)-pos(y.id));
  const ids=new Set(N.items.map(x=>x.id));
  N.regular=(old.regular||[]).filter(r=>ids.has(r.from)&&ids.has(r.to));
  N.ops.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
  N.bad=bad;return N;
}
// загрузка любого CSV: свой формат или CoinKeeper; текущая база заменяется только после подтверждения
function confirmReplace(N,what){
  const bad=N.bad||0;delete N.bad;
  if(!S||!S.ops.length){S=N;persist();tab='coins';month=ym(today());render();toast('Загружено: '+fmt(N.ops.length)+' операций');return}
  const cnt=g=>N.items.filter(x=>x.g===g).length;
  $('panel').innerHTML='<div class="row"><b class="grow">Загрузить '+what+'?</b><button class="x" id="l-close" aria-label="Закрыть">✕</button></div>'+
    '<div>В файле: <b>'+fmt(N.ops.length)+'</b> операций, '+cnt('exp')+' категорий, '+cnt('in')+' доходов, '+cnt('acc')+' счетов.'+(bad?' Пропущено строк: '+bad+'.':'')+'</div>'+
    '<div class="notice">Текущая база ('+fmt(S.ops.length)+' операций) будет заменена. Если не уверен — сначала сохрани копию.</div>'+
    '<button class="btn" id="l-backup">Сохранить копию текущей (JSON)</button><button class="btn primary" id="l-go">Заменить базу</button>';
  $('sheet').hidden=false;$('l-close').onclick=closeSheet;$('l-backup').onclick=exportJson;
  $('l-go').onclick=()=>{sortUndo=JSON.stringify(S);S=N;persist();closeSheet();tab='coins';month=ym(today());render();toast('Загружено: '+fmt(N.ops.length)+' операций')};
}
function exportJson(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='monetki-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
$('file-json').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const s=JSON.parse(await f.text());if(!s||s.v!==1||!Array.isArray(s.ops))throw 0;S=s;persist();toast('Восстановлено: '+fmt(S.ops.length)+' операций');tab='coins';render()}catch(_){toast('Это не копия Монеток')}};

/* ---------- импорт CoinKeeper ---------- */
function parseCSV(text,sep){sep=sep||',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
function importCK(text){
  text=text.replace(/^﻿/,'');
  const rows=parseCSV(text).filter(r=>!/^sep=/.test(r[0]||''));
  // секции разделены пустыми строками
  const secs=[];let cur=[];for(const r of rows){if(r.length===1&&r[0]===''){if(cur.length)secs.push(cur);cur=[]}else cur.push(r)}if(cur.length)secs.push(cur);
  const opsSec=secs.find(s=>s[0][0]==='Данные'&&s[0][1]==='Тип');
  if(!opsSec)throw new Error('Не похоже на выгрузку CoinKeeper');
  const budgetSecs=secs.filter(s=>s[0][0]==='Название'&&s[0][1]==='Бюджет');
  const accSec=secs.find(s=>s[0][0]==='Название'&&s[0][1]==='Текущее значение');
  const N=blank();const byName={in:{},acc:{},exp:{}};
  const add=(g,name,icon,extra)=>{name=name.trim();if(byName[g][name])return byName[g][name];const it=Object.assign({id:'i'+(N.seq++).toString(36),g,name,icon:CK_ICON[icon]||({in:'job',acc:'wallet',exp:'star'})[g]},extra||{});N.items.push(it);byName[g][name]=it;return it};
  const ord=list=>(a,b)=>{const ia=list.indexOf(a[0].trim()),ib=list.indexOf(b[0].trim());return (ia<0?99:ia)-(ib<0?99:ib)};
  if(budgetSecs[0])for(const r of budgetSecs[0].slice(1).sort(ord(IN_ORDER)))add('in',r[0],r[3]);
  const accVal={};
  if(accSec)for(const r of accSec.slice(1).sort(ord(ACC_ORDER))){const v=+r[1]||0;add('acc',r[0],r[2],{hidden:v===0,start:0});accVal[r[0].trim()]=v}
  const expRows=budgetSecs[1]?budgetSecs[1].slice(1):[];
  expRows.sort((a,b)=>{const ia=EXP_ORDER.indexOf(a[0].trim()),ib=EXP_ORDER.indexOf(b[0].trim());return (ia<0?99:ia)-(ib<0?99:ib)});
  for(const r of expRows)add('exp',r[0],r[3],{layer:DEFAULT_LAYER[r[0].trim()]||'base'});
  const find=name=>byName.acc[name]||byName.in[name]||byName.exp[name];
  for(const r of opsSec.slice(1)){
    if(r.length<6||!/^\d\d\.\d\d\.\d{4}$/.test(r[0]))continue;
    const [dd,mm,yy]=r[0].split('.');const from=r[2].trim(),to=r[3].trim();
    let a,b;
    if(r[1]==='Расход'){a=find(from)||add('acc',from,'',{hidden:true,start:0});b=byName.exp[to]||add('exp',to,'',{hidden:true,layer:'base'})}
    else{a=find(from)||add('in',from,'',{hidden:true});b=find(to)||add('acc',to,'',{hidden:true,start:0})}
    const op={id:'c'+(N.seq++).toString(36),d:yy+'-'+mm+'-'+dd,from:a.id,to:b.id,sum:Math.round(+r[5]||0)};
    const tag=r[4].trim();if(tag)op.tag=tag;const note=(r[10]||'').trim();if(note)op.note=note;
    if(op.sum>0)N.ops.push(op);
  }
  N.ops.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
  // стартовые остатки: чтобы баланс совпал с текущим значением в CoinKeeper
  const fl={};for(const o of N.ops){(fl[o.to]=fl[o.to]||{i:0,o:0}).i+=o.sum;(fl[o.from]=fl[o.from]||{i:0,o:0}).o+=o.sum}
  for(const it of N.items)if(it.g==='acc'){const f=fl[it.id]||{i:0,o:0};it.start=(accVal[it.name]||0)-f.i+f.o}
  // переоценка: брокерские счета раз в неделю, вклады раз в месяц
  for(const it of N.items)if(it.g==='acc'&&!it.hidden){if(/брок|инв/i.test(it.name)){it.reval=true;it.revalDays=7}else if(/вклад/i.test(it.name)){it.reval=true;it.revalDays=30}}
  // известные регулярные платежи
  const card=byName.acc['Карта'],self=byName.exp['На себя'];
  if(card&&self){
    N.regular.push({id:'r1',name:'Кредит',sum:5255,day:23,from:card.id,to:self.id,tag:'кредит',until:'2026-11'});
    N.regular.push({id:'r2',name:'Подписка',sum:1490,day:24,from:card.id,to:self.id,tag:'подписка',until:''});
    N.regular.push({id:'r3',name:'Стрижка',sum:1100,day:17,from:card.id,to:self.id,tag:'стрижка',until:''});
  }
  return N;
}
$('file-csv').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const text=readText(await f.arrayBuffer());const own=importOwn(text);
    if(own)confirmReplace(own,'базу из CSV');else confirmReplace(importCK(text),'выгрузку CoinKeeper')}
  catch(err){toast(err.message||'Не удалось прочитать файл')}};
$('fr-import').onclick=()=>$('file-csv').click();
$('fr-empty').onclick=()=>{S=blank();
  for(const [n,ic] of BASE.in)S.items.push({id:uid('i'),g:'in',name:n,icon:ic});
  for(const [n,ic,x] of BASE.acc)S.items.push(Object.assign({id:uid('i'),g:'acc',name:n,icon:ic,start:0},x||{}));
  for(const [n,ic,l,subs,sl] of BASE.exp)S.items.push({id:uid('i'),g:'exp',name:n,icon:ic,layer:l,subs:subs.slice(),subLayer:Object.assign({},sl||{})});
  persist();render()};

/* ---------- общее ---------- */
function toast(s){const t=$('toast');t.textContent=s;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;closeSheet();render()});
$('toggle-in').onclick=()=>{showIn=!showIn;render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});
render();
setTimeout(()=>{const sp=$('splash');if(sp)sp.remove()},1200);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
